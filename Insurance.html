          { title: "加護病房 / 燒燙傷中心", status: "終身有效", amount: "另加 2,000元/日", desc: "實際入住期間除一般住院日額外，另加2,000元/日（最高365天）。" },

        company: "富邦產物（團險）",

        annualFee: 1680,
        summary: "年繳只要 1,680 元，完整補齊南山保單沒有的意外身故、意外失能、意外醫療10萬實支實付與400萬重大燒燙傷！",

      { age: "66-70歲", hs: 1986, sir: 1280, hir: 2730 }

    const PRESET_SCENARIOS = [
      { id: "accident", label: "🏍️ 騎車摔傷小腿骨折", type: "accident", days: 5, selfPay: 60000, sirMult: 10, icuDays: 0, isCancer: false, desc: "住院5天、開刀自費鋼板6萬元" },
      { id: "disease", label: "🏥 生病住院微創手術", type: "disease", days: 5, selfPay: 120000, sirMult: 20, icuDays: 0, isCancer: false, desc: "住院5天、自費達文西或醫材12萬元" },
      { id: "cancer", label: "🎗️ 確診重度癌症開刀", type: "disease", days: 10, selfPay: 80000, sirMult: 40, icuDays: 0, isCancer: true, desc: "初次罹癌住院10天、癌症切除手術＋自費8萬" },
      { id: "icu", label: "🚑 意外重傷住加護病房", type: "accident", days: 7, selfPay: 90000, sirMult: 20, icuDays: 4, isCancer: false, desc: "總住院7天（含4天加護病房）、自費9萬" }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState("overview");
      const [expandedIds, setExpandedIds] = useState({ "N182217452": true, "FUBON-PLAN1": true });
      const [sim, setSim] = useState(PRESET_SCENARIOS[1]);

      const togglePolicy = (id) => {
        setExpandedIds(prev => ({ ...prev, [id]: !prev[id] }));
      };

      // Calculate dynamic simulation payout
      const calcResult = useMemo(() => {
        const d = Number(sim.days) || 0;
        const icu = Math.min(Number(sim.icuDays) || 0, d);
        const sp = Number(sim.selfPay) || 0;
        const isAcc = sim.type === "accident";
        const isCan = sim.isCancer;

        // 1. Daily cash
        const phiDaily = d <= 30 ? d * 1000 : 30 * 1000 + (d - 30) * 2000;
        const phiDischarge = d * 500;
        const phiIcu = icu * 2000;
        const hirDaily = d <= 30 ? d * 700 : 30 * 700 + (d - 30) * 875;
        const fubonDaily = isAcc ? d * 2000 : 0;
        const fubonIcu = isAcc ? icu * 2000 : 0;
        const fubonComfort = isAcc && d > 0 ? 3000 : 0;
        const crDaily = isCan ? d * (1200 + 800) : 0;

        // 2. Surgery fixed
        const sirPay = sim.sirMult * 1000;
        const crSurg = isCan ? 30000 : 0;

        // 3. Medical reimbursement (實支實付)
        const hsLimit = sim.sirMult >= 40 ? 45000 : 15000;
        let fubonReimb = 0;
        let hsReimb = 0;
        if (isAcc) {
          fubonReimb = Math.min(sp, 100000);
          hsReimb = Math.min(Math.max(sp - fubonReimb, 0), hsLimit);
        } else {
          hsReimb = Math.min(sp, hsLimit);
        }

        // 4. Lump sum CI/Cancer
        const lumpSum = isCan ? 900000 : 0;

        const totalPayout = phiDaily + phiDischarge + phiIcu + hirDaily + fubonDaily + fubonIcu + fubonComfort + crDaily + sirPay + crSurg + fubonReimb + hsReimb + lumpSum;
        const netDiff = totalPayout - sp;

        return {
          breakdown: [
            { name: "南山 20PHI 終身醫療（日額＋療養＋加護）", val: phiDaily + phiDischarge + phiIcu },
            { name: "南山 HIR 住院日額", val: hirDaily },
            { name: "南山 SIR 手術定額", val: sirPay },
            { name: "南山 HS 實支實付（上限 " + (hsLimit/10000) + " 萬）", val: hsReimb },
            ...(isAcc ? [
              { name: "富邦團險 意外醫療實支（上限10萬）", val: fubonReimb },
              { name: "富邦團險 意外住院日額＋加護＋慰問金", val: fubonDaily + fubonIcu + fubonComfort }
            ] : []),
            ...(isCan ? [
              { name: "南山 20PPLC＋20CR 重度癌症一次金", val: lumpSum },
              { name: "南山 20CR 癌症住院＋療養＋癌症手術", val: crDaily + crSurg }
            ] : [])
          ].filter(x => x.val > 0),
          totalPayout,
          selfPay: sp,
          netDiff
        };
      }, [sim]);

      return (
        <div className="min-h-screen pb-16">
          {/* Hero Header */}
          <header className="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 text-white pt-8 pb-10 px-4 shadow-lg">
            <div className="max-w-5xl mx-auto">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                <span className="inline-flex items-center gap-1.5 text-xs font-semibold tracking-wider uppercase bg-blue-500/20 text-blue-200 border border-blue-400/30 px-3 py-1 rounded-full">
                  <ShieldIcon className="w-3.5 h-3.5" /> 個人保單保障互動指南
                </span>
                <span className="text-xs text-slate-400">更新日期：民國 115 年 11 月｜被保險人：林劭芳（27歲）</span>
              </div>
              <h1 className="text-2xl sm:text-3xl font-black tracking-tight mb-2">
                南山人壽 4 張 ＋ 富邦團險計畫一
              </h1>
              <p className="text-slate-300 text-sm sm:text-base max-w-2xl">
                4 張南山主約與終身防癌皆已繳費期滿，搭配公司高 CP 值富邦團險，每年僅需 <strong className="text-white">4,624 元</strong> 即可維持完整基礎防線。
              </p>

              {/* KPI Grid */}
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-6">
                <div className="bg-white/10 backdrop-blur-sm border border-white/15 rounded-xl p-3.5">
                  <div className="text-xs text-slate-300 mb-1">目前每年總保費</div>
                  <div className="text-xl sm:text-2xl font-black text-white">NT$ 4,624</div>
                  <div className="text-[11px] text-slate-300 mt-1">南山3附約 2,944 ＋ 富邦 1,680</div>
                </div>
                <div className="bg-white/10 backdrop-blur-sm border border-white/15 rounded-xl p-3.5">
                  <div className="text-xs text-slate-300 mb-1">最高身故保障</div>
                  <div className="text-xl sm:text-2xl font-black text-emerald-300">711.8 萬元</div>
                  <div className="text-[11px] text-slate-300 mt-1">疾病 511.8 萬＋一般意外 200 萬</div>
                </div>
                <div className="bg-white/10 backdrop-blur-sm border border-white/15 rounded-xl p-3.5">
                  <div className="text-xs text-slate-300 mb-1">意外醫療實支實付</div>
                  <div className="text-xl sm:text-2xl font-black text-sky-300">10 萬元／次</div>
                  <div className="text-[11px] text-slate-300 mt-1">富邦計畫一（門急住院皆可用）</div>
                </div>
                <div className="bg-rose-500/20 backdrop-blur-sm border border-rose-400/40 rounded-xl p-3.5">
                  <div className="text-xs text-rose-200 mb-1 flex items-center gap-1">
                    <AlertIcon className="w-3.5 h-3.5" /> 疾病實支（最大缺口）
                  </div>
                  <div className="text-xl sm:text-2xl font-black text-rose-200">1.5 萬元／次</div>
                  <div className="text-[11px] text-rose-200/90 mt-1">南山 HS 計劃 3（不含門診手術）</div>
                </div>
              </div>
            </div>
          </header>

          {/* Sticky Navigation Tabs */}
          <nav className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
            <div className="max-w-5xl mx-auto px-4 flex gap-2 overflow-x-auto no-scrollbar py-2.5">

                { id: "overview", label: "保障總覽", icon: ShieldIcon },

          {/* Main Content */}
          <main className="max-w-5xl mx-auto px-4 pt-6">

            {/* TAB 1: OVERVIEW */}
            {activeTab === "overview" && (
              <div className="space-y-6">
                {/* Summary Banner */}
                <div className="bg-blue-50 border-l-4 border-blue-800 rounded-r-xl p-4 sm:p-5">
                  <h2 className="font-bold text-blue-950 text-base mb-1.5">💡 一句話看懂你的保障全貌</h2>
                  <p className="text-sm text-slate-700 leading-relaxed">
                    你的<strong>「壽險、終身住院日額、意外險」</strong>底盤都非常穩固，且 4 張南山主約皆已繳費期滿免再繳錢。
                    目前唯一需要留意的風險，是<strong>「生病住院遇到高價自費醫材或門診手術」</strong>（疾病實支僅 1.5 萬），以及未來若離開現職公司時記得補上個人意外險。
                  </p>
                </div>

                {/* Disease vs Accident Comparison Cards */}
                <div className="grid md:grid-cols-2 gap-4">
                  <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                    <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                      <h3 className="font-bold text-lg text-slate-900">🏥 如果是「生病」發生</h3>
                      <span className="text-xs font-semibold bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full">南山 4 張主支撐</span>
                    </div>
                    <ul className="space-y-3 text-sm">
                      <li className="flex justify-between gap-2"><span className="text-slate-500">身故／全殘保障</span><strong className="text-slate-900 text-right">最高 511.8 萬元</strong></li>
                      <li className="flex justify-between gap-2"><span className="text-slate-500">一般住院日額 (1~30天)</span><strong className="text-slate-900 text-right">1,700 元/日 (+療養500)</strong></li>
                      <li className="flex justify-between gap-2"><span className="text-slate-500">加護病房日額</span><strong className="text-slate-900 text-right">3,700 元/日 (+療養500)</strong></li>
                      <li className="flex justify-between gap-2"><span className="text-slate-500">住院實支實付 (雜費+手術)</span><strong className="text-rose-600 text-right">僅 1.5 萬元 (缺口!)</strong></li>
                      <li className="flex justify-between gap-2"><span className="text-slate-500">住院手術定額</span><strong className="text-slate-900 text-right">1萬～5萬元 / 次</strong></li>
                      <li className="flex justify-between gap-2"><span className="text-slate-500">重度癌症／7項重疾一次金</span><strong className="text-emerald-700 text-right">最高 90 萬元</strong></li>
                    </ul>
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                    <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                      <h3 className="font-bold text-lg text-slate-900">⚡ 如果是「意外」發生</h3>
                      <span className="text-xs font-semibold bg-teal-100 text-teal-800 px-2.5 py-1 rounded-full">南山 ＋ 富邦團險疊加</span>
                    </div>
                    <ul className="space-y-3 text-sm">
                      <li className="flex justify-between gap-2"><span className="text-slate-500">一般意外身故／失能</span><strong className="text-slate-900 text-right">最高 711.8 萬元</strong></li>
                      <li className="flex justify-between gap-2"><span className="text-slate-500">大眾運輸／火災地震電梯</span><strong className="text-teal-700 text-right">另含 400 萬元</strong></li>
                      <li className="flex justify-between gap-2"><span className="text-slate-500">意外住院日額 (1~30天)</span><strong className="text-slate-900 text-right">3,700 元/日 (+慰問3千)</strong></li>
                      <li className="flex justify-between gap-2"><span className="text-slate-500">加護／燒燙傷病房日額</span><strong className="text-slate-900 text-right">5,700 元/日 (+療養500)</strong></li>
                      <li className="flex justify-between gap-2"><span className="text-slate-500">意外醫療實支實付</span><strong className="text-teal-700 text-right">10 萬元 / 次 (充裕!)</strong></li>
                      <li className="flex justify-between gap-2"><span className="text-slate-500">重大燒燙傷一次金</span><strong className="text-teal-700 text-right">400 萬元</strong></li>
                    </ul>
                  </div>
                </div>

                {/* Visual Bar Chart of Core Coverage */}
                <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                  <h3 className="font-bold text-slate-900 mb-4">📊 五張保單核心保額分布（萬元）</h3>
                  <div className="space-y-3.5">
                    {[
                      { label: "南山 終身增額壽險 (N182231713)", val: 291.8, max: 300, color: "bg-blue-900", note: "每年再長大 1.8 萬" },
                      { label: "富邦 團險計畫一 (一般意外)", val: 200, max: 300, color: "bg-teal-600", note: "特定事故/燒燙傷 400 萬" },
                      { label: "南山 新康祥壽險C型 (N182233067)", val: 100, max: 300, color: "bg-blue-600", note: "含7項重疾先領 70 萬" },
                      { label: "南山 終身醫療帳戶 (H182005936)", val: 100, max: 300, color: "bg-sky-500", note: "醫療帳戶餘額身故退還" },
                      { label: "南山 512還本終身 (N182217452)", val: 20, max: 300, color: "bg-slate-500", note: "每5年領還本金 2 萬" }
                    ].map((row, idx) => (
                      <div key={idx}>
                        <div className="flex justify-between text-xs sm:text-sm mb-1">
                          <span className="font-semibold text-slate-700">{row.label}</span>
                          <span className="font-bold text-slate-900">{row.val} 萬元 <span className="text-xs font-normal text-slate-400">({row.note})</span></span>
                        </div>
                        <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                          <div className={`${row.color} h-full rounded-full transition-all duration-500`} style={{ width: `${(row.val / row.max) * 100}%` }} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: POLICIES DETAIL */}
            {activeTab === "policies" && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <p className="text-sm text-slate-500">點擊各張保單卡片可展開／收合詳細給付規則</p>
                  <button
                    onClick={() => {
                      const allOpen = Object.keys(expandedIds).length === POLICIES.length && Object.values(expandedIds).every(Boolean);
                      const next = {};
                      POLICIES.forEach(p => next[p.id] = !allOpen);
                      setExpandedIds(next);
                    }}
                    className="text-xs font-semibold text-blue-700 hover:underline"
                  >
                    全部展開／收合
                  </button>
                </div>

                {POLICIES.map(pol => {
                  const open = !!expandedIds[pol.id];
                  return (
                    <div key={pol.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                      <button
                        onClick={() => togglePolicy(pol.id)}
                        className="w-full text-left p-5 flex items-start justify-between gap-4 hover:bg-slate-50/80 transition-colors"
                      >
                        <div className="space-y-1.5">
                          <div className="flex flex-wrap items-center gap-2">
                            <span className="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded">{pol.company}</span>
                            <span className="text-xs font-mono text-slate-500">{pol.id}</span>
                            <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full ${pol.tagColor}`}>{pol.tag}</span>
                          </div>
                          <h3 className="text-base sm:text-lg font-bold text-slate-900">{pol.name}</h3>
                          <p className="text-sm text-slate-600">{pol.summary}</p>
                        </div>
                        <div className="flex flex-col items-end shrink-0 gap-2">
                          <div className="text-right">
                            <div className="text-[11px] text-slate-400">目前年繳</div>
                            <div className="text-base font-black text-blue-900">
                              {pol.annualFee === 0 ? "0 元" : `NT$ ${pol.annualFee.toLocaleString()}`}
                            </div>
                          </div>
                          <ChevronIcon open={open} />
                        </div>
                      </button>

                      {open && (
                        <div className="px-5 pb-5 pt-2 border-t border-slate-100 bg-slate-50/50">
                          <div className="flex flex-wrap gap-4 text-xs text-slate-500 mb-3">
                            <span>📅 契約始期：{pol.startDate}</span>
                            <span>👤 要保人：{pol.holder}</span>
                          </div>
                          <div className="grid sm:grid-cols-2 gap-3">
                            {pol.items.map((item, idx) => (
                              <div key={idx} className="bg-white rounded-xl border border-slate-200/80 p-3.5">
                                <div className="flex justify-between items-start gap-2 mb-1">
                                  <span className="font-bold text-sm text-slate-900">{item.title}</span>
                                  <span className="text-[11px] font-semibold bg-slate-100 text-slate-600 px-2 py-0.5 rounded shrink-0">{item.status}</span>
                                </div>
                                <div className="text-sm font-extrabold text-blue-800 mb-1.5">{item.amount}</div>
                                <p className="text-xs text-slate-600 leading-relaxed">{item.desc}</p>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}

            {/* TAB 3: INTERACTIVE CLAIM SIMULATOR */}
            {activeTab === "simulator" && (
              <div className="space-y-5">
                <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                  <h2 className="font-bold text-lg text-slate-900 mb-1">🧮 互動理賠情境試算</h2>
                  <p className="text-sm text-slate-500 mb-4">點選常見情境或自行調整天數與自費金額，馬上看看 5 張保單合計能賠多少！</p>

                  {/* Preset Buttons */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5 mb-5">
                    {PRESET_SCENARIOS.map(p => (
                      <button
                        key={p.id}
                        onClick={() => setSim(p)}
                        className={`text-left p-3 rounded-xl border transition-all ${
                          sim.id === p.id
                            ? "border-blue-800 bg-blue-50 ring-1 ring-blue-800"
                            : "border-slate-200 hover:bg-slate-50"
                        }`}
                      >
                        <div className="font-bold text-sm text-slate-900">{p.label}</div>
                        <div className="text-xs text-slate-500 mt-0.5">{p.desc}</div>
                      </button>
                    ))}
                  </div>

                  {/* Custom Sliders */}
                  <div className="grid sm:grid-cols-3 gap-4 bg-slate-50 rounded-xl p-4 border border-slate-200/80">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">事故類型</label>
                      <div className="flex gap-2">
                        <button
                          onClick={() => setSim(s => ({ ...s, id: "custom", type: "disease" }))}
                          className={`flex-1 py-1.5 text-xs font-bold rounded-lg border ${sim.type === "disease" ? "bg-blue-900 text-white border-blue-900" : "bg-white text-slate-600 border-slate-300"}`}
                        >疾病</button>
                        <button
                          onClick={() => setSim(s => ({ ...s, id: "custom", type: "accident", isCancer: false }))}
                          className={`flex-1 py-1.5 text-xs font-bold rounded-lg border ${sim.type === "accident" ? "bg-teal-700 text-white border-teal-700" : "bg-white text-slate-600 border-slate-300"}`}
                        >意外</button>
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">住院天數：{sim.days} 天</label>
                      <input type="range" min="1" max="30" value={sim.days} onChange={e => setSim(s => ({ ...s, id: "custom", days: Number(e.target.value) }))} className="w-full accent-blue-800" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">醫院自費金額：NT$ {sim.selfPay.toLocaleString()}</label>
                      <input type="range" min="0" max="250000" step="10000" value={sim.selfPay} onChange={e => setSim(s => ({ ...s, id: "custom", selfPay: Number(e.target.value) }))} className="w-full accent-blue-800" />
                    </div>
                  </div>
                </div>

                {/* Result Panel */}
                <div className="grid md:grid-cols-5 gap-4">
                  <div className="md:col-span-3 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                    <h3 className="font-bold text-slate-900 mb-3">📋 各保單理賠明細（估算）</h3>
                    <div className="divide-y divide-slate-100">
                      {calcResult.breakdown.map((b, i) => (
                        <div key={i} className="py-2.5 flex justify-between items-center text-sm">
                          <span className="text-slate-700">{b.name}</span>
                          <span className="font-bold text-slate-900">NT$ {b.val.toLocaleString()}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className={`md:col-span-2 rounded-2xl p-5 shadow-sm border flex flex-col justify-between ${calcResult.netDiff >= 0 ? "bg-emerald-50 border-emerald-200" : "bg-rose-50 border-rose-200"}`}>
                    <div>
                      <div className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">試算合計可領理賠金</div>
                      <div className="text-3xl font-black text-slate-900 mb-4">NT$ {calcResult.totalPayout.toLocaleString()}</div>
                      <div className="space-y-1.5 text-sm border-t border-black/10 pt-3">
                        <div className="flex justify-between"><span className="text-slate-600">預估醫院自費</span><span className="font-semibold">- NT$ {calcResult.selfPay.toLocaleString()}</span></div>
                        <div className="flex justify-between font-bold text-base pt-1">
                          <span>理賠後淨額</span>
                          <span className={calcResult.netDiff >= 0 ? "text-emerald-700" : "text-rose-700"}>
                            {calcResult.netDiff >= 0 ? `+ NT$ ${calcResult.netDiff.toLocaleString()}` : `- NT$ ${Math.abs(calcResult.netDiff).toLocaleString()}`}
                          </span>
                        </div>
                      </div>
                    </div>
                    <p className="text-xs mt-4 leading-relaxed text-slate-600">
                      {calcResult.netDiff >= 0
                        ? "✅ 目前保障足以覆蓋本次自費支出，並有餘額可補貼休養與薪資損失。"
                        : "⚠️ 出現自費缺口！因疾病實支實付(HS)雜費上限僅 1.5 萬，遇到高價自費手術或醫材時須自掏腰包。"}
                    </p>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: PREMIUMS & CHECKUP */}
            {activeTab === "checkup" && (
              <div className="space-y-6">
                {/* Renewal Premium Table */}
                <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                  <h2 className="font-bold text-lg text-slate-900 mb-1">📈 南山 3 張定期附約未來保費走勢表</h2>
                  <p className="text-xs text-slate-500 mb-4">依保單條款費率表（女性）試算，不含富邦團險 1,680 元/年。實際費率仍以保險公司公告為準。</p>
                  <div className="overflow-x-auto">
                    <table className="w-full text-sm text-left">
                      <thead>
                        <tr className="bg-slate-100 text-slate-700 text-xs">
                          <th className="py-2.5 px-3 rounded-l-lg">年齡區間</th>
                          <th className="py-2.5 px-3 text-right">HS 實支(計劃3)</th>
                          <th className="py-2.5 px-3 text-right">SIR 手術(1,000)</th>
                          <th className="py-2.5 px-3 text-right">HIR 日額(700)</th>
                          <th className="py-2.5 px-3 text-right rounded-r-lg">南山附約合計</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {AGE_FEES.map((r, i) => {
                          const tot = r.hs + r.sir + r.hir;
                          return (
                            <tr key={i} className={i === 0 ? "bg-blue-50/70 font-bold text-blue-950" : "hover:bg-slate-50"}>
                              <td className="py-2.5 px-3">{r.age}</td>
                              <td className="py-2.5 px-3 text-right">${r.hs.toLocaleString()}</td>
                              <td className="py-2.5 px-3 text-right">${r.sir.toLocaleString()}</td>
                              <td className="py-2.5 px-3 text-right">${r.hir.toLocaleString()}</td>
                              <td className="py-2.5 px-3 text-right font-bold text-blue-900">${tot.toLocaleString()}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Cashback & Action Checklist */}
                <div className="grid md:grid-cols-2 gap-4">
                  <div className="bg-amber-50 border border-amber-200 rounded-2xl p-5">
                    <h3 className="font-bold text-amber-950 mb-2">💰 別忘了領錢：512還本金時程</h3>
                    <p className="text-sm text-amber-900/90 leading-relaxed mb-3">
                      保單 <strong>N182217452</strong>（512還本終身壽險）已繳費期滿，之後<strong>每滿 5 年可領 20,000 元</strong>生存還本金（終身有效）：
                    </p>
                    <div className="flex flex-wrap gap-2 text-xs font-bold">
                      <span className="bg-white/80 text-slate-500 px-3 py-1.5 rounded-lg border border-amber-200 line-through">113年（第25年）已領</span>
                      <span className="bg-amber-600 text-white px-3 py-1.5 rounded-lg shadow-sm">118年（第30年）領 2 萬</span>
                      <span className="bg-white text-amber-900 px-3 py-1.5 rounded-lg border border-amber-300">123年（第35年）領 2 萬</span>
                    </div>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                    <h3 className="font-bold text-slate-900 mb-3">✅ 保單健檢 4 項行動清單</h3>
                    <ul className="space-y-2.5 text-sm text-slate-700">
                      <li className="flex items-start gap-2">
                        <span className="text-rose-600 font-bold">1.</span>
                        <span><strong>優先補疾病實支實付</strong>：目標雜費 20～30 萬、保證續保、含門診手術；先問南山原主約能否直接附加以省主約費。</span>
                      </li>
                      <li className="flex items-start gap-2">
                        <span className="text-blue-700 font-bold">2.</span>
                        <span><strong>次要補重大傷病險</strong>：涵蓋健保 300 多項疾病（見卡即賠），補足舊制 7 項重疾門檻較嚴的盲區。</span>
                      </li>
                      <li className="flex items-start gap-2">
                        <span className="text-amber-600 font-bold">3.</span>
                        <span><strong>轉職記得接軌意外險</strong>：富邦計畫一為公司團險，離職即失效，轉換跑道前須提前投保個人意外險。</span>
                      </li>
                      <li className="flex items-start gap-2">
                        <span className="text-emerald-700 font-bold">4.</span>
                        <span><strong>檢視保單基本資料</strong>：確認南山 4 張保單的聯絡地址、職業與受益人設定是否需更新。</span>
                      </li>
                    </ul>
                  </div>
                </div>
              </div>
            )}
          </main>

          <footer className="max-w-5xl mx-auto px-4 mt-12 pt-6 border-t border-slate-200 text-center text-xs text-slate-400">
            本頁面依據南山人壽（N182217452、N182231713、N182233067、H182005936）及富邦產物中興工程職委會團體傷害險計畫一之保單條款整理，實際理賠仍以保險單正本條款與核定結果為準。
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
