<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行記帳本（雲端同步版）</title>

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 與 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 轉譯 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Firebase (Compat 版本，適合單一 HTML 直接使用) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Quicksand:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Nunito', 'Quicksand', 'Noto Sans TC', sans-serif;
            background-color: #fdf2f8;
        }

        .cute-scrollbar::-webkit-scrollbar { width: 8px; }
        .cute-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .cute-scrollbar::-webkit-scrollbar-thumb { background-color: #fbcfe8; border-radius: 20px; }

        .editable-textarea { resize: none; overflow: hidden; }
        .tabular { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // =====================================================================
        // ===== 🔥 Firebase 設定區（已填入你的專屬資訊）=====
        // =====================================================================
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBHxPcS0K9tREYfA8ko8oaIXNazaY0AGv0",
            authDomain: "travel-ledger-fac38.firebaseapp.com",
            databaseURL: "https://travel-ledger-fac38-default-rtdb.firebaseio.com",
            projectId: "travel-ledger-fac38",
            storageBucket: "travel-ledger-fac38.firebasestorage.app",
            messagingSenderId: "761494015306",
            appId: "1:761494015306:web:1715289dca6097d59185b3",
            measurementId: "G-R1FD083CK7"
        };

        // 初始化 Firebase
        let db = null;
        let firebaseReady = false;
        try {
            if (FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.includes("貼上你的")) {
                if (!firebase.apps.length) {
                    firebase.initializeApp(FIREBASE_CONFIG);
                }
                db = firebase.database();
                firebaseReady = true;
            }
        } catch (err) {
            console.error("Firebase 初始化失敗：", err);
        }

        // =====================================================================
        // ===== 一般設定區 =====
        // =====================================================================
        const STORAGE_PREFIX = "travel-expense-";
        const APP_NAME = "旅行記帳本";

        const DEFAULT_SECTIONS = [
            { id: "food",      title: "餐飲美食",   icon: "🍽️", theme: 0, items: [] },
            { id: "transport", title: "交通",       icon: "🚆", theme: 1, items: [] },
            { id: "stay",      title: "住宿",       icon: "🏨", theme: 2, items: [] },
            { id: "shopping",  title: "購物伴手禮", icon: "🛍️", theme: 3, items: [] },
            { id: "tickets",   title: "門票與活動", icon: "🎟️", theme: 4, items: [] },
            { id: "others",    title: "其他雜支",   icon: "📦", theme: 5, items: [] },
            { id: "subsidy",   title: "家人／公司補助", icon: "🎁", theme: 4, kind: "subsidy", items: [] },
        ];

        const DEFAULT_TRIPS = [
            { id: "trip-bangkok", title: "✨ 2026 泰國曼谷旅行記帳 🐘", settings: { currency: "THB", rate: "0.95", budget: "30000" } },
            { id: "trip-sydney",  title: "✨ 2027 澳洲雪梨旅行記帳 🐨", settings: { currency: "AUD", rate: "21",   budget: "50000" } },
        ];

        const DEFAULT_PEOPLE = [
            { id: "me", name: "我", icon: "🙋" },
        ];

        const THEMES = [
            { bgColor: "bg-gradient-to-br from-orange-50 to-amber-100/60",  borderColor: "border-orange-100",  btnColor: "bg-orange-400" },
            { bgColor: "bg-gradient-to-br from-cyan-50 to-blue-100/60",     borderColor: "border-cyan-100",    btnColor: "bg-cyan-500" },
            { bgColor: "bg-gradient-to-br from-purple-50 to-indigo-100/60", borderColor: "border-purple-100",  btnColor: "bg-indigo-400" },
            { bgColor: "bg-gradient-to-br from-rose-50 to-pink-100/60",     borderColor: "border-rose-100",    btnColor: "bg-pink-400" },
            { bgColor: "bg-gradient-to-br from-emerald-50 to-green-100/60", borderColor: "border-emerald-100", btnColor: "bg-emerald-500" },
            { bgColor: "bg-gradient-to-br from-yellow-50 to-lime-100/60",   borderColor: "border-yellow-100",  btnColor: "bg-yellow-500" },
        ];

        // =====================================================================
        // ===== 以下通常不需要修改 =====
        // =====================================================================
        const PEOPLE_KEY = `${STORAGE_PREFIX}people`;
        const personKey = (personId) => `${STORAGE_PREFIX}person-${personId}`;

        const EMPTY_SETTINGS = { currency: "", rate: "", budget: "" };

        const PAY_METHODS = {
            card: { icon: "💳", label: "刷卡" },
            cash: { icon: "💵", label: "現金" },
        };

        // ===== 自製向量圖示 =====
        const Plus = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const Trash2 = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const ChevronUp = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>;
        const ChevronDown = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>;
        const Wallet = ({ size = 24, className }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>;

        // ===== 工具函式 =====
        function readLocal(key, fallback) {
            try {
                const saved = localStorage.getItem(key);
                return saved !== null ? JSON.parse(saved) : fallback;
            } catch {
                return fallback;
            }
        }

        function writeLocal(key, val) {
            try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
        }

        function cleanForFirebase(val) {
            return JSON.parse(JSON.stringify(val));
        }

        // 支援 Firebase 即時同步的 state Hook（含防抖，打字不卡頓）
        function useCloudState(key, defaultValue) {
            const [value, setValue] = useState(() => {
                const fallback = typeof defaultValue === 'function' ? defaultValue() : defaultValue;
                return readLocal(key, fallback);
            });
            const timerRef = useRef(null);
            const isWritingRef = useRef(false);

            useEffect(() => {
                if (!firebaseReady || !db) return;
                const ref = db.ref(`ledgerData/${key}`);

                const onValue = (snapshot) => {
                    if (isWritingRef.current) return;
                    const remote = snapshot.val();
                    if (remote !== null && remote !== undefined) {
                        setValue(remote);
                        writeLocal(key, remote);
                    } else {
                        const initial = readLocal(key, typeof defaultValue === 'function' ? defaultValue() : defaultValue);
                        ref.set(cleanForFirebase(initial)).catch(console.error);
                    }
                };

                ref.on('value', onValue, (err) => console.error("讀取失敗：", err));
                return () => ref.off('value', onValue);
            }, [key]);

            const setCloudValue = (updater) => {
                setValue(prev => {
                    const next = typeof updater === 'function' ? updater(prev) : updater;
                    writeLocal(key, next);

                    if (firebaseReady && db) {
                        isWritingRef.current = true;
                        if (timerRef.current) clearTimeout(timerRef.current);
                        timerRef.current = setTimeout(() => {
                            db.ref(`ledgerData/${key}`)
                                .set(cleanForFirebase(next))
                                .catch(console.error)
                                .finally(() => {
                                    setTimeout(() => { isWritingRef.current = false; }, 150);
                                });
                        }, 300);
                    }
                    return next;
                });
            };

            return [value, setCloudValue];
        }

        function newId(prefix) {
            return `${prefix}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
        }

        function freshSections() {
            return DEFAULT_SECTIONS.map(s => ({ ...s, items: [] }));
        }

        function makeTrip({ id, title, note, settings, sections }) {
            return {
                id: id || newId("trip"),
                title: title ?? "✨ 新的旅程記帳 ✈️",
                note: note ?? "",
                settings: { ...EMPTY_SETTINGS, ...(settings || {}) },
                sections: Array.isArray(sections) ? sections : freshSections(),
            };
        }

        function buildFirstLedger() {
            const trips = DEFAULT_TRIPS.map(t => makeTrip(t));
            return { trips, activeTripId: trips[trips.length - 1].id };
        }

        function cloneLedgerWithoutItems(ledger) {
            const source = ledger && Array.isArray(ledger.trips) && ledger.trips.length > 0
                ? ledger.trips
                : DEFAULT_TRIPS.map(t => makeTrip(t));
            const trips = source.map(t => makeTrip({
                id: t.id,
                title: t.title,
                note: t.note,
                settings: t.settings,
                sections: (t.sections || []).map(s => ({ ...s, items: [] })),
            }));
            return { trips, activeTripId: (ledger && ledger.activeTripId) || trips[0].id };
        }

        function readHashPersonId() {
            const h = decodeURIComponent(window.location.hash || "");
            return h.startsWith("#p-") ? h.slice(3) : null;
        }

        function moveInArray(arr, index, direction) {
            const target = index + direction;
            if (target < 0 || target >= arr.length) return arr;
            const next = [...arr];
            [next[index], next[target]] = [next[target], next[index]];
            return next;
        }

        function toNumber(value) {
            const n = parseFloat(String(value ?? "").replace(/,/g, ""));
            return Number.isFinite(n) ? n : 0;
        }

        function cleanAmountInput(value) {
            return value.replace(/[^\d.,]/g, "");
        }

        function formatMoney(n, digits = 2) {
            return n.toLocaleString("zh-TW", { minimumFractionDigits: 0, maximumFractionDigits: digits });
        }

        function todayString() {
            const d = new Date();
            const pad = (x) => String(x).padStart(2, "0");
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }

        function isSubsidy(section) {
            return section && section.kind === "subsidy";
        }

        function itemTwd(item, rate) {
            const a = toNumber(item.amount);
            return item.currency === "TWD" ? a : a * rate;
        }

        function sectionTotalTwd(section, rate) {
            return (Array.isArray(section.items) ? section.items : []).reduce((sum, item) => sum + itemTwd(item, rate), 0);
        }

        function dualMoney(twd, settings, sign = "") {
            const rate = toNumber(settings.rate);
            const currency = settings.currency || "外幣";
            if (rate > 0) {
                return { main: `${sign}${currency} ${formatMoney(twd / rate)}`, sub: `≈ ${sign}NT$ ${formatMoney(twd, 0)}` };
            }
            return { main: `${sign}NT$ ${formatMoney(twd, 0)}`, sub: "填寫匯率後會顯示外幣" };
        }

        // ===== 雲端連線狀態標籤 =====
        const SyncBadge = () => {
            const [connected, setConnected] = useState(false);

            useEffect(() => {
                if (!firebaseReady || !db) return;
                const connRef = db.ref(".info/connected");
                const onConn = (snap) => setConnected(snap.val() === true);
                connRef.on("value", onConn);
                return () => connRef.off("value", onConn);
            }, []);

            if (!firebaseReady) {
                return (
                    <div className="text-center text-xs font-bold px-3 py-1.5 rounded-full bg-amber-100 text-amber-700 inline-block">
                        🟡 尚未填入 Firebase 設定，目前為單機模式
                    </div>
                );
            }
            return (
                <div className={`text-center text-xs font-bold px-3 py-1.5 rounded-full inline-block ${connected ? "bg-emerald-100 text-emerald-700" : "bg-gray-200 text-gray-500"}`}>
                    {connected ? "🟢 雲端即時同步中" : "⚪ 正在連線至雲端資料庫…"}
                </div>
            );
        };

        // ===== 會自動長高的文字框 =====
        const AutoTextarea = ({ value, className, style, ...props }) => {
            const ref = useRef(null);
            const resize = () => {
                const el = ref.current;
                if (!el) return;
                el.style.height = 'auto';
                el.style.height = el.scrollHeight + 'px';
            };
            useEffect(resize, [value]);
            useEffect(() => {
                window.addEventListener('resize', resize);
                return () => window.removeEventListener('resize', resize);
            }, []);
            return <textarea ref={ref} value={value} className={className} style={style} {...props} />;
        };

        const MoveButtons = ({ onUp, onDown, disableUp, disableDown, label }) => (
            <div className="flex flex-col flex-shrink-0">
                <button onClick={onUp} disabled={disableUp} aria-label={`${label}上移`} title="上移" className="p-1 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-white/70 disabled:opacity-20 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-colors">
                    <ChevronUp size={16} />
                </button>
                <button onClick={onDown} disabled={disableDown} aria-label={`${label}下移`} title="下移" className="p-1 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-white/70 disabled:opacity-20 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-colors">
                    <ChevronDown size={16} />
                </button>
            </div>
        );

        const PayMethodButton = ({ method, onToggle }) => {
            const m = PAY_METHODS[method] || PAY_METHODS.card;
            return (
                <button onClick={onToggle} title={`付款方式：${m.label}（點擊切換）`} aria-label={`付款方式：${m.label}，點擊切換`} className="flex-shrink-0 flex items-center gap-1 px-2 py-1 rounded-xl bg-gray-50 hover:bg-gray-100 text-sm font-medium text-gray-600 transition-colors">
                    <span className="text-base">{m.icon}</span>{m.label}
                </button>
            );
        };

        const SettingsCard = ({ settings, onChange }) => (
            <div className="p-6 rounded-[2rem] bg-white/70 border-2 border-white shadow-xl shadow-gray-200/50">
                <h2 className="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">⚙️ 記帳設定</h2>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <label className="block">
                        <span className="text-sm font-medium text-gray-500">當地幣別</span>
                        <input type="text" value={settings.currency} onChange={(e) => onChange({ currency: e.target.value.toUpperCase() })} placeholder="例如 AUD" className="mt-1 w-full px-4 py-2 rounded-2xl bg-white border-2 border-pink-100 focus:border-pink-300 outline-none font-bold text-gray-700" />
                    </label>
                    <label className="block">
                        <span className="text-sm font-medium text-gray-500">匯率（1 {settings.currency || "外幣"} = ? 新臺幣）</span>
                        <input type="text" inputMode="decimal" value={settings.rate} onChange={(e) => onChange({ rate: cleanAmountInput(e.target.value) })} placeholder="例如 21" className="mt-1 w-full px-4 py-2 rounded-2xl bg-white border-2 border-pink-100 focus:border-pink-300 outline-none font-bold text-gray-700 tabular" />
                    </label>
                    <label className="block">
                        <span className="text-sm font-medium text-gray-500">總預算（新臺幣）</span>
                        <input type="text" inputMode="decimal" value={settings.budget} onChange={(e) => onChange({ budget: cleanAmountInput(e.target.value) })} placeholder="例如 50000" className="mt-1 w-full px-4 py-2 rounded-2xl bg-white border-2 border-pink-100 focus:border-pink-300 outline-none font-bold text-gray-700 tabular" />
                    </label>
                </div>
                <p className="mt-3 text-xs text-gray-400">匯率預設值只是示範，請改成你換匯或刷卡時的實際匯率。</p>
            </div>
        );

        const SummaryCard = ({ sections, settings }) => {
            const rate = toNumber(settings.rate);
            const budget = toNumber(settings.budget);

            const expenseSections = sections.filter(s => !isSubsidy(s));
            const subsidySections = sections.filter(s => isSubsidy(s));
            const expenseItems = expenseSections.flatMap(s => Array.isArray(s.items) ? s.items : []);

            const expenseTwd = expenseItems.reduce((sum, i) => sum + itemTwd(i, rate), 0);
            const subsidyTwd = subsidySections.reduce((sum, s) => sum + sectionTotalTwd(s, rate), 0);
            const netTwd = expenseTwd - subsidyTwd;

            const remaining = budget - netTwd;
            const percent = budget > 0 ? Math.max(0, (netTwd / budget) * 100) : 0;
            const over = budget > 0 && netTwd > budget;

            const cashTwd = expenseItems.filter(i => i.method === "cash").reduce((s, i) => s + itemTwd(i, rate), 0);
            const cardTwd = expenseTwd - cashTwd;

            const days = new Set(expenseItems.filter(i => toNumber(i.amount) > 0 && i.date).map(i => i.date)).size;
            const dailyTwd = days > 0 ? expenseTwd / days : 0;

            const breakdown = expenseSections
                .map(s => ({ s, total: sectionTotalTwd(s, rate) }))
                .filter(x => x.total > 0)
                .sort((a, b) => b.total - a.total);

            const exp = dualMoney(expenseTwd, settings);
            const sub = dualMoney(subsidyTwd, settings, subsidyTwd > 0 ? "−" : "");
            const net = dualMoney(netTwd, settings);
            const rem = dualMoney(Math.abs(remaining), settings);

            const SmallStat = ({ label, twd }) => {
                const m = dualMoney(twd, settings);
                return (
                    <div className="p-3 rounded-2xl bg-white/70 text-center">
                        <div className="text-xs text-gray-500 font-medium">{label}</div>
                        <div className="font-bold text-gray-700 tabular">{m.main}</div>
                        <div className="text-xs text-gray-400 tabular">{rate > 0 ? m.sub : ""}</div>
                    </div>
                );
            };

            return (
                <div className="p-6 rounded-[2rem] bg-gradient-to-br from-pink-100/80 via-white to-violet-100/80 border-2 border-pink-100 shadow-xl shadow-pink-100/50 space-y-5">
                    <h2 className="text-xl font-bold text-gray-700 flex items-center gap-2">📊 花費總覽</h2>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div className="p-4 rounded-2xl bg-white/80">
                            <div className="text-sm text-gray-500 font-medium">總支出</div>
                            <div className="text-2xl font-extrabold text-gray-800 tabular">{exp.main}</div>
                            <div className="text-sm text-gray-500 tabular">{exp.sub}</div>
                        </div>
                        <div className="p-4 rounded-2xl bg-emerald-50/90">
                            <div className="text-sm text-emerald-600 font-medium">🎁 補助扣除</div>
                            <div className="text-2xl font-extrabold text-emerald-600 tabular">{sub.main}</div>
                            <div className="text-sm text-emerald-500 tabular">{sub.sub}</div>
                        </div>
                        <div className="p-4 rounded-2xl bg-gradient-to-br from-pink-200/80 to-violet-200/80 ring-2 ring-pink-200">
                            <div className="text-sm text-pink-600 font-bold">💰 實際自付</div>
                            <div className="text-2xl font-extrabold text-gray-800 tabular">{net.main}</div>
                            <div className="text-sm text-gray-600 tabular">{net.sub}</div>
                        </div>
                    </div>

                    {budget > 0 && (
                        <div className="p-4 rounded-2xl bg-white/80 space-y-2">
                            <div className="flex flex-wrap items-baseline justify-between gap-2">
                                <span className="text-sm text-gray-500 font-medium">{over ? "已超出預算（以實際自付計算）" : "預算剩餘（以實際自付計算）"}</span>
                                <span className={`font-extrabold tabular ${over ? "text-red-500" : "text-emerald-600"}`}>
                                    {rem.main}<span className="ml-2 text-sm font-medium text-gray-400">{rate > 0 ? rem.sub : ""}</span>
                                </span>
                            </div>
                            <div className="flex justify-between text-xs font-medium text-gray-400">
                                <span>預算使用率</span>
                                <span className={`tabular ${over ? "text-red-500" : ""}`}>{formatMoney(percent, 1)}%</span>
                            </div>
                            <div className="h-4 rounded-full bg-gray-100 overflow-hidden">
                                <div className={`h-full rounded-full transition-all duration-500 ${over ? "bg-red-400" : percent > 80 ? "bg-amber-400" : "bg-gradient-to-r from-pink-300 to-violet-400"}`} style={{ width: `${Math.min(percent, 100)}%` }} />
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-3 gap-3">
                        <SmallStat label="💳 刷卡支出" twd={cardTwd} />
                        <SmallStat label="💵 現金支出" twd={cashTwd} />
                        <SmallStat label={`📅 每日平均支出（${days} 天）`} twd={dailyTwd} />
                    </div>

                    {breakdown.length > 0 ? (
                        <div className="space-y-2">
                            <div className="text-sm font-medium text-gray-500">支出分類占比</div>
                            {breakdown.map(({ s, total }) => {
                                const theme = THEMES[s.theme % THEMES.length] || THEMES[0];
                                const share = expenseTwd > 0 ? (total / expenseTwd) * 100 : 0;
                                const m = dualMoney(total, settings);
                                return (
                                    <div key={s.id} className="flex items-center gap-2 text-sm">
                                        <span className="w-28 sm:w-36 flex-shrink-0 truncate font-medium text-gray-600">{s.icon} {s.title || "未命名"}</span>
                                        <div className="flex-grow h-3 rounded-full bg-white/80 overflow-hidden">
                                            <div className={`h-full rounded-full ${theme.btnColor}`} style={{ width: `${share}%` }} />
                                        </div>
                                        <span className="w-32 sm:w-40 flex-shrink-0 text-right tabular text-gray-600">{m.main}（{formatMoney(share, 0)}%）</span>
                                    </div>
                                );
                            })}
                        </div>
                    ) : (
                        <div className="text-center text-gray-400 font-medium py-2">還沒有任何支出，從下方分類開始記第一筆吧 ✍️</div>
                    )}
                </div>
            );
        };

        const CurrencyButton = ({ value, currency, onToggle }) => (
            <button onClick={onToggle} title="點擊切換幣別（外幣／新臺幣）" aria-label="切換幣別" className="flex-shrink-0 px-2 py-1 rounded-xl bg-gray-50 hover:bg-gray-100 text-sm font-bold text-gray-500 transition-colors">
                {value === "TWD" ? "NT$" : (currency || "外幣")} ⇄
            </button>
        );

        const ExpenseSection = ({ section, settings, onChange, onMoveUp, onMoveDown, onDelete, isFirst, isLast, autoFocusTitle }) => {
            const [newDesc, setNewDesc] = useState("");
            const [newAmount, setNewAmount] = useState("");
            const [newMethod, setNewMethod] = useState("card");
            const [newCurrency, setNewCurrency] = useState("foreign");
            const [newDate, setNewDate] = useState(todayString());
            const titleRef = useRef(null);

            const subsidy = isSubsidy(section);
            const currency = settings.currency || "外幣";
            const rate = toNumber(settings.rate);
            const theme = THEMES[section.theme % THEMES.length] || THEMES[0];
            const items = Array.isArray(section.items) ? section.items : [];
            const setItems = (newItems) => onChange({ items: newItems });
            const subtotal = dualMoney(sectionTotalTwd(section, rate), settings, subsidy ? "−" : "");

            useEffect(() => {
                const el = titleRef.current && titleRef.current.querySelector('textarea');
                if (autoFocusTitle && el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.focus();
                    el.select();
                }
            }, [autoFocusTitle]);

            const handleAddItem = () => {
                if (newDesc.trim() === "" && newAmount.trim() === "") return;
                setItems([...items, { id: Date.now(), date: newDate, text: newDesc, amount: newAmount, method: newMethod, currency: newCurrency }]);
                setNewDesc("");
                setNewAmount("");
            };

            const updateItem = (id, patch) => setItems(items.map(item => item.id === id ? { ...item, ...patch } : item));
            const handleDeleteItem = (id) => setItems(items.filter(item => item.id !== id));
            const handleMoveItem = (index, direction) => setItems(moveInArray(items, index, direction));
            const sortByDate = () => setItems([...items].sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999")));
            const toggleCurrency = (v) => v === "TWD" ? "foreign" : "TWD";

            const onEnterAdd = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleAddItem(); } };
            const amountColor = subsidy ? "text-emerald-600" : "text-gray-800";

            return (
                <div className={`p-6 rounded-[2rem] shadow-xl shadow-gray-200/50 ${theme.bgColor} border-2 ${subsidy ? "border-emerald-200" : theme.borderColor} transition-all hover:shadow-2xl`}>
                    <div ref={titleRef} className="flex items-start gap-1 mb-1">
                        <input
                            type="text"
                            value={section.icon}
                            onChange={(e) => onChange({ icon: e.target.value })}
                            aria-label="分類圖示"
                            title="點擊更換圖示（可輸入 emoji）"
                            className="w-12 flex-shrink-0 text-3xl text-center bg-transparent rounded-xl outline-none hover:bg-white/50 focus:bg-white/70 transition-all"
                        />
                        <AutoTextarea
                            value={section.title}
                            onChange={(e) => onChange({ title: e.target.value })}
                            onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } }}
                            rows={1}
                            placeholder="輸入分類名稱"
                            aria-label="分類名稱"
                            className="flex-grow min-w-0 text-2xl font-bold text-gray-700 bg-transparent rounded-xl px-2 py-1 outline-none hover:bg-white/50 focus:bg-white/70 transition-all editable-textarea placeholder-gray-400"
                        />
                        <div className="flex items-center flex-shrink-0">
                            <button onClick={() => onChange({ theme: (section.theme + 1) % THEMES.length })} aria-label="切換分類顏色" title="切換顏色" className="p-1.5 rounded-lg text-lg hover:bg-white/70 transition-colors">🎨</button>
                            <MoveButtons onUp={onMoveUp} onDown={onMoveDown} disableUp={isFirst} disableDown={isLast} label="分類" />
                            <button onClick={onDelete} aria-label="刪除整個分類" title="刪除整個分類" className="p-1.5 rounded-lg text-gray-300 hover:text-red-400 hover:bg-white/70 transition-colors"><Trash2 size={20} /></button>
                        </div>
                    </div>

                    <div className="ml-0 sm:ml-14 mb-5 flex flex-wrap items-center gap-2">
                        <button
                            onClick={() => onChange({ kind: subsidy ? "expense" : "subsidy" })}
                            title="點擊切換：支出（累加）／補助（從總支出扣除）"
                            className={`px-3 py-1 rounded-full text-xs font-bold transition-colors ${subsidy ? "bg-emerald-500 text-white hover:bg-emerald-600" : "bg-white/80 text-gray-500 hover:bg-white"}`}
                        >
                            {subsidy ? "➖ 補助（扣除）" : "➕ 支出"}
                        </button>
                        <span className={`font-medium tabular ${subsidy ? "text-emerald-600" : "text-gray-500"}`}>
                            {subsidy ? "補助合計" : "小計"} {subtotal.main}
                            {rate > 0 && <span className="text-gray-400"> {subtotal.sub}</span>}
                        </span>
                        {items.length > 1 && (
                            <button onClick={sortByDate} title="依日期由早到晚排列" className="ml-auto px-3 py-1 rounded-full text-xs font-bold bg-white/80 text-gray-500 hover:bg-white transition-colors">
                                📅 依日期排序
                            </button>
                        )}
                    </div>

                    <div className="space-y-3 mb-5">
                        {items.length === 0 && (
                            <div className="text-center text-gray-400 font-medium py-5 rounded-2xl bg-white/40">
                                {subsidy ? "還沒有補助，在下方記下來源與金額，會從總支出扣除 🎁" : "還沒有花費，在下方記下第一筆吧 ✍️"}
                            </div>
                        )}
                        {items.map((item, index) => (
                            <div key={item.id} className="group p-3 rounded-2xl bg-white hover:bg-white/90 shadow-sm space-y-2">
                                <AutoTextarea
                                    value={item.text}
                                    onChange={(e) => updateItem(item.id, { text: e.target.value })}
                                    rows={1}
                                    placeholder={subsidy ? "補助來源" : "品項說明"}
                                    aria-label={subsidy ? "補助來源" : "品項說明"}
                                    className="w-full bg-transparent rounded-lg px-1 outline-none font-medium text-gray-700 focus:bg-gray-50 transition-all editable-textarea placeholder-gray-300"
                                    style={{ minHeight: '1.75rem' }}
                                />
                                <div className="flex flex-wrap items-center gap-2">
                                    <input type="date" value={item.date || ""} onChange={(e) => updateItem(item.id, { date: e.target.value })} aria-label="日期" className="flex-shrink-0 px-2 py-1 rounded-xl bg-gray-50 text-sm text-gray-600 outline-none focus:bg-gray-100" />
                                    {!subsidy && <PayMethodButton method={item.method} onToggle={() => updateItem(item.id, { method: item.method === "cash" ? "card" : "cash" })} />}
                                    <div className="flex items-center gap-1 ml-auto">
                                        {subsidy && <span className="font-bold text-emerald-600">−</span>}
                                        <CurrencyButton value={item.currency} currency={currency} onToggle={() => updateItem(item.id, { currency: toggleCurrency(item.currency) })} />
                                        <input type="text" inputMode="decimal" value={item.amount} onChange={(e) => updateItem(item.id, { amount: cleanAmountInput(e.target.value) })} placeholder="0" aria-label="金額" className={`w-24 px-2 py-1 rounded-xl bg-gray-50 text-right font-bold outline-none focus:bg-gray-100 tabular ${amountColor}`} />
                                    </div>
                                    <div className="flex items-center flex-shrink-0 md:opacity-0 md:group-hover:opacity-100 md:focus-within:opacity-100 transition-opacity">
                                        <MoveButtons onUp={() => handleMoveItem(index, -1)} onDown={() => handleMoveItem(index, 1)} disableUp={index === 0} disableDown={index === items.length - 1} label="項目" />
                                        <button onClick={() => handleDeleteItem(item.id)} aria-label="刪除這一筆" title="刪除" className="text-gray-300 hover:text-red-400 transition-colors p-1.5"><Trash2 size={18} /></button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className={`p-3 rounded-2xl bg-white/60 border-2 border-dashed ${subsidy ? "border-emerald-300" : "border-gray-300"} space-y-2`}>
                        <input type="text" value={newDesc} onChange={(e) => setNewDesc(e.target.value)} onKeyDown={onEnterAdd} placeholder={subsidy ? "補助來源：例如 公司差旅補助、爸媽贊助 🎁" : "記一筆：買了什麼？ ✍️"} className="w-full px-2 py-1 bg-transparent outline-none font-medium text-gray-600 placeholder-gray-400" />
                        <div className="flex flex-wrap items-center gap-2">
                            <input type="date" value={newDate} onChange={(e) => setNewDate(e.target.value)} aria-label="新增項目的日期" className="flex-shrink-0 px-2 py-1.5 rounded-xl bg-white text-sm text-gray-600 outline-none border-2 border-transparent focus:border-gray-200" />
                            {!subsidy && <PayMethodButton method={newMethod} onToggle={() => setNewMethod(newMethod === "cash" ? "card" : "cash")} />}
                            <div className="flex items-center gap-1 flex-grow justify-end">
                                {subsidy && <span className="font-bold text-emerald-600">−</span>}
                                <CurrencyButton value={newCurrency} currency={currency} onToggle={() => setNewCurrency(toggleCurrency(newCurrency))} />
                                <input type="text" inputMode="decimal" value={newAmount} onChange={(e) => setNewAmount(cleanAmountInput(e.target.value))} onKeyDown={onEnterAdd} placeholder="金額" className={`w-28 px-3 py-2 rounded-xl bg-white text-right font-bold outline-none border-2 border-transparent focus:border-gray-200 tabular ${amountColor}`} />
                            </div>
                            <button onClick={handleAddItem} aria-label="新增這一筆" className={`px-4 py-2 ${subsidy ? "bg-emerald-500" : theme.btnColor} text-white rounded-xl hover:scale-105 hover:shadow-lg transition-transform flex items-center justify-center flex-shrink-0`}>
                                <Plus size={22} />
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const TripView = ({ trip, personName, onChange, onDelete, onClear, onMoveLeft, onMoveRight, isFirst, isLast, autoFocusTitle }) => {
            const [newSectionId, setNewSectionId] = useState(null);
            const titleRef = useRef(null);

            const settings = { ...EMPTY_SETTINGS, ...(trip.settings || {}) };
            const sections = Array.isArray(trip.sections) ? trip.sections : [];

            useEffect(() => {
                if (autoFocusTitle && titleRef.current) {
                    titleRef.current.focus();
                    titleRef.current.select();
                }
            }, [autoFocusTitle]);

            const setSections = (next) => onChange({ sections: next });
            const updateSettings = (patch) => onChange({ settings: { ...settings, ...patch } });
            const updateSection = (id, patch) => setSections(sections.map(s => s.id === id ? { ...s, ...patch } : s));
            const moveSection = (index, direction) => setSections(moveInArray(sections, index, direction));

            const deleteSection = (section) => {
                const name = section.title.trim() || "這個分類";
                const count = (section.items || []).length;
                const extra = count > 0 ? `以及裡面的 ${count} 筆花費` : "";
                if (confirm(`確定要刪除「${name}」${extra}嗎？`)) {
                    setSections(sections.filter(s => s.id !== section.id));
                }
            };

            const addSection = (kind = "expense") => {
                const id = newId("section");
                const section = kind === "subsidy"
                    ? { id, title: "補助", icon: "🎁", theme: 4, kind: "subsidy", items: [] }
                    : { id, title: "新的分類", icon: "📌", theme: sections.length % THEMES.length, kind: "expense", items: [] };
                setSections([...sections, section]);
                setNewSectionId(id);
            };

            return (
                <div className="space-y-8">
                    <div className="text-center space-y-3">
                        <input ref={titleRef} type="text" value={trip.title} onChange={(e) => onChange({ title: e.target.value })} placeholder="輸入旅程名稱" aria-label="旅程名稱" className="w-full text-center text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-rose-400 to-violet-500 bg-transparent border-none outline-none hover:bg-white/40 focus:bg-white/60 rounded-2xl p-2 transition-all placeholder-pink-200" />
                        <AutoTextarea
                            value={trip.note || ""}
                            onChange={(e) => onChange({ note: e.target.value })}
                            rows={1}
                            placeholder="📝 點這裡輸入補充說明，例如：旅行日期 2027/8/28 ~ 9/3、同行成員、住宿地點…"
                            aria-label="旅程補充說明"
                            className="w-full max-w-2xl mx-auto block text-center text-lg font-medium text-gray-600 bg-white/40 hover:bg-white/60 focus:bg-white/80 rounded-2xl px-4 py-2 outline-none transition-all editable-textarea placeholder-gray-400"
                        />
                        <p className="text-sm text-gray-400 font-medium flex items-center justify-center gap-2">
                            <Wallet size={16} className="text-pink-300" />
                            {personName} 的記帳 · 每一筆都能直接修改，會自動同步至雲端
                            <Wallet size={16} className="text-pink-300" />
                        </p>
                    </div>

                    <SummaryCard sections={sections} settings={settings} />
                    <SettingsCard settings={settings} onChange={updateSettings} />

                    <div className="flex flex-col gap-8">
                        {sections.map((section, index) => (
                            <ExpenseSection
                                key={section.id}
                                section={section}
                                settings={settings}
                                onChange={(patch) => updateSection(section.id, patch)}
                                onMoveUp={() => moveSection(index, -1)}
                                onMoveDown={() => moveSection(index, 1)}
                                onDelete={() => deleteSection(section)}
                                isFirst={index === 0}
                                isLast={index === sections.length - 1}
                                autoFocusTitle={section.id === newSectionId}
                            />
                        ))}

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <button onClick={() => addSection("expense")} className="w-full py-6 rounded-[2rem] border-2 border-dashed border-gray-300 text-gray-500 font-bold text-lg hover:border-pink-300 hover:text-pink-500 hover:bg-white/50 transition-all flex items-center justify-center gap-2">
                                <Plus size={22} /> 新增支出分類
                            </button>
                            <button onClick={() => addSection("subsidy")} className="w-full py-6 rounded-[2rem] border-2 border-dashed border-emerald-300 text-emerald-600 font-bold text-lg hover:border-emerald-400 hover:bg-emerald-50/60 transition-all flex items-center justify-center gap-2">
                                <Plus size={22} /> 新增補助（扣除）
                            </button>
                        </div>
                    </div>

                    <div className="p-4 rounded-[2rem] bg-white/50 border-2 border-white flex flex-wrap items-center justify-center gap-2 text-sm font-medium">
                        <span className="text-gray-400 mr-1">這趟旅程：</span>
                        <button onClick={onMoveLeft} disabled={isFirst} className="px-3 py-2 rounded-xl bg-white text-gray-600 hover:bg-pink-50 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">◀ 分頁往左</button>
                        <button onClick={onMoveRight} disabled={isLast} className="px-3 py-2 rounded-xl bg-white text-gray-600 hover:bg-pink-50 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">分頁往右 ▶</button>
                        <button onClick={onClear} className="px-3 py-2 rounded-xl bg-white text-gray-600 hover:bg-amber-50 hover:text-amber-600 transition-colors">🧹 清空所有花費</button>
                        <button onClick={onDelete} className="px-3 py-2 rounded-xl bg-white text-gray-600 hover:bg-red-50 hover:text-red-500 transition-colors">🗑️ 刪除這趟旅程</button>
                    </div>
                </div>
            );
        };

        const TripTabs = ({ trips, activeTripId, onSelect, onAdd }) => (
            <div className="flex gap-2 overflow-x-auto pb-2 cute-scrollbar">
                {trips.map(t => {
                    const active = t.id === activeTripId;
                    const label = (t.title || "").replace(/[✨]/g, "").trim() || "未命名旅程";
                    return (
                        <button key={t.id} onClick={() => onSelect(t.id)} title={label} className={`flex-shrink-0 max-w-[16rem] truncate px-4 py-2.5 rounded-2xl font-bold text-sm transition-all ${active ? "bg-white text-pink-500 shadow-lg shadow-pink-100 border-2 border-pink-200" : "bg-white/50 text-gray-500 border-2 border-transparent hover:bg-white/80"}`}>
                            {label}
                        </button>
                    );
                })}
                <button onClick={onAdd} className="flex-shrink-0 px-4 py-2.5 rounded-2xl font-bold text-sm text-gray-500 border-2 border-dashed border-gray-300 hover:border-pink-300 hover:text-pink-500 hover:bg-white/50 transition-all flex items-center gap-1">
                    <Plus size={16} /> 新增旅程
                </button>
            </div>
        );

        const PersonLedger = ({ person, initialLedger }) => {
            const [ledger, setLedger] = useCloudState(personKey(person.id), initialLedger);
            const [newTripId, setNewTripId] = useState(null);

            const trips = (ledger && Array.isArray(ledger.trips) && ledger.trips.length > 0)
                ? ledger.trips
                : [makeTrip(DEFAULT_TRIPS[0])];
            const activeTrip = trips.find(t => t.id === (ledger && ledger.activeTripId)) || trips[0];
            const activeIndex = trips.indexOf(activeTrip);

            useEffect(() => {
                const t = (activeTrip.title || "").replace(/[✨]/g, "").trim() || APP_NAME;
                document.title = `${t} · ${person.name || "記帳人"}`;
            }, [activeTrip.title, person.name]);

            const update = (fn) => setLedger(prev => {
                const base = (prev && Array.isArray(prev.trips) && prev.trips.length > 0) ? prev : { trips, activeTripId: activeTrip.id };
                return fn(base);
            });

            const selectTrip = (id) => update(l => ({ ...l, activeTripId: id }));
            const updateTrip = (id, patch) => update(l => ({ ...l, trips: l.trips.map(t => t.id === id ? { ...t, ...patch } : t) }));

            const addTrip = () => {
                const trip = makeTrip({ settings: { ...activeTrip.settings, budget: "" } });
                update(l => ({ ...l, trips: [...l.trips, trip], activeTripId: trip.id }));
                setNewTripId(trip.id);
            };

            const moveTrip = (direction) => update(l => ({ ...l, trips: moveInArray(l.trips, l.trips.findIndex(t => t.id === activeTrip.id), direction) }));

            const clearTrip = () => {
                if (confirm(`確定要清空「${(activeTrip.title || "這趟旅程").replace(/[✨]/g, "").trim()}」的所有花費嗎？分類會保留，這個動作無法復原。`)) {
                    updateTrip(activeTrip.id, { sections: (activeTrip.sections || []).map(s => ({ ...s, items: [] })) });
                }
            };

            const deleteTrip = () => {
                if (!confirm(`確定要刪除「${(activeTrip.title || "這趟旅程").replace(/[✨]/g, "").trim()}」以及所有記帳嗎？這個動作無法復原。`)) return;
                update(l => {
                    const rest = l.trips.filter(t => t.id !== activeTrip.id);
                    const next = rest.length > 0 ? rest : [makeTrip({})];
                    const neighbor = next[Math.min(activeIndex, next.length - 1)];
                    return { ...l, trips: next, activeTripId: neighbor.id };
                });
            };

            return (
                <div className="space-y-6">
                    <TripTabs trips={trips} activeTripId={activeTrip.id} onSelect={selectTrip} onAdd={addTrip} />
                    <TripView
                        key={activeTrip.id}
                        trip={activeTrip}
                        personName={person.name || "記帳人"}
                        onChange={(patch) => updateTrip(activeTrip.id, patch)}
                        onDelete={deleteTrip}
                        onClear={clearTrip}
                        onMoveLeft={() => moveTrip(-1)}
                        onMoveRight={() => moveTrip(1)}
                        isFirst={activeIndex === 0}
                        isLast={activeIndex === trips.length - 1}
                        autoFocusTitle={activeTrip.id === newTripId}
                    />
                </div>
            );
        };

        const PeopleBar = ({ people, currentId, onSelect, onAdd, onUpdate, onDelete, onOpenNewTab }) => {
            const current = people.find(p => p.id === currentId);
            return (
                <div className="p-4 rounded-[2rem] bg-white/60 border-2 border-white shadow-lg shadow-pink-100/40 space-y-3">
                    <div className="flex items-center justify-between gap-2 flex-wrap">
                        <div className="flex items-center gap-2 overflow-x-auto pb-1 cute-scrollbar">
                            <span className="flex-shrink-0 text-sm font-bold text-gray-500">記帳人</span>
                            {people.map(p => (
                                <button key={p.id} onClick={() => onSelect(p.id)} className={`flex-shrink-0 px-3 py-1.5 rounded-full font-bold text-sm transition-all ${p.id === currentId ? "bg-gradient-to-r from-pink-400 to-violet-400 text-white shadow-md" : "bg-white text-gray-600 hover:bg-pink-50"}`}>
                                    {p.icon} {p.name || "未命名"}
                                </button>
                            ))}
                            <button onClick={onAdd} className="flex-shrink-0 px-3 py-1.5 rounded-full font-bold text-sm text-gray-500 border-2 border-dashed border-gray-300 hover:border-pink-300 hover:text-pink-500 transition-all flex items-center gap-1">
                                <Plus size={14} /> 新增記帳人
                            </button>
                        </div>
                        <SyncBadge />
                    </div>
                    {current && (
                        <div className="flex flex-wrap items-center gap-2 text-sm">
                            <input type="text" value={current.icon} onChange={(e) => onUpdate(current.id, { icon: e.target.value })} aria-label="記帳人圖示" title="點擊更換圖示" className="w-10 text-center text-xl bg-white rounded-xl py-1 outline-none focus:ring-2 focus:ring-pink-200" />
                            <input type="text" value={current.name} onChange={(e) => onUpdate(current.id, { name: e.target.value })} placeholder="輸入名字" aria-label="記帳人名字" className="w-32 px-3 py-1.5 bg-white rounded-xl font-bold text-gray-700 outline-none focus:ring-2 focus:ring-pink-200" />
                            <button onClick={() => onOpenNewTab(current.id)} className="px-3 py-1.5 rounded-xl bg-white text-gray-600 font-medium hover:bg-pink-50 transition-colors">↗️ 在新分頁開啟</button>
                            <button onClick={() => onDelete(current)} disabled={people.length <= 1} className="px-3 py-1.5 rounded-xl bg-white text-gray-400 font-medium hover:bg-red-50 hover:text-red-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">🗑️ 刪除此記帳人</button>
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            const [people, setPeople] = useCloudState(PEOPLE_KEY, DEFAULT_PEOPLE);
            const [hashId, setHashId] = useState(readHashPersonId());

            const list = Array.isArray(people) && people.length > 0 ? people : DEFAULT_PEOPLE;
            const current = list.find(p => p.id === hashId) || list[0];

            useEffect(() => {
                const onHash = () => setHashId(readHashPersonId());
                window.addEventListener('hashchange', onHash);
                return () => window.removeEventListener('hashchange', onHash);
            }, []);

            const selectPerson = (id) => { window.location.hash = `p-${id}`; };
            const pageUrl = (id) => `${window.location.href.split('#')[0]}#p-${id}`;
            const openNewTab = (id) => { window.open(pageUrl(id), '_blank'); };

            const addPerson = () => {
                const id = newId("person");
                const currentLedger = readLocal(personKey(current.id), null);
                const newLedger = cloneLedgerWithoutItems(currentLedger);
                writeLocal(personKey(id), newLedger);
                if (firebaseReady && db) {
                    db.ref(`ledgerData/${personKey(id)}`).set(cleanForFirebase(newLedger)).catch(console.error);
                }
                const icons = ["🙋‍♀️", "🙋‍♂️", "🧑", "👧", "👦", "🧓"];
                setPeople(prev => [...(Array.isArray(prev) ? prev : DEFAULT_PEOPLE), { id, name: `記帳人 ${list.length + 1}`, icon: icons[list.length % icons.length] }]);
                selectPerson(id);
            };

            const updatePerson = (id, patch) => setPeople(prev => (Array.isArray(prev) ? prev : DEFAULT_PEOPLE).map(p => p.id === id ? { ...p, ...patch } : p));

            const deletePerson = (person) => {
                if (list.length <= 1) return;
                if (!confirm(`確定要刪除「${person.name || "這位記帳人"}」以及他的所有旅程記帳嗎？這個動作無法復原。`)) return;
                try { localStorage.removeItem(personKey(person.id)); } catch {}
                if (firebaseReady && db) {
                    db.ref(`ledgerData/${personKey(person.id)}`).remove().catch(console.error);
                }
                const rest = list.filter(p => p.id !== person.id);
                setPeople(rest);
                selectPerson(rest[0].id);
            };

            const initialLedger = () => current.id === DEFAULT_PEOPLE[0].id ? buildFirstLedger() : cloneLedgerWithoutItems(null);

            return (
                <div className="min-h-screen bg-gradient-to-br from-pink-50 via-purple-50 to-blue-50 py-8 px-4 cute-scrollbar">
                    <div className="max-w-4xl mx-auto space-y-6">
                        <PeopleBar
                            people={list}
                            currentId={current.id}
                            onSelect={selectPerson}
                            onAdd={addPerson}
                            onUpdate={updatePerson}
                            onDelete={deletePerson}
                            onOpenNewTab={openNewTab}
                        />

                        <PersonLedger key={current.id} person={current} initialLedger={initialLedger} />

                        <div className="text-center pb-8 text-sm text-gray-400 font-medium">
                            花得開心、記得清楚，祝旅途愉快！ ✈️
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
