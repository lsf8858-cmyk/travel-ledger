        // ===== 自製向量圖示 =====
        const Plus = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const Trash2 = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const Check = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
        const ChevronUp = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>;
        const ChevronDown = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>;
        const Heart = ({ size = 24, className }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>;

        // ===== 工具函式 =====
        function readLocal(key, fallback) {
            try {
                const saved = localStorage.getItem(key);
                return saved !== null ? JSON.parse(saved) : fallback;
            } catch {
                return fallback;
            }
        }

        function writeLocal(key, val) {
            try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
        }

        function cleanForFirebase(val) {
            return JSON.parse(JSON.stringify(val));
        }

        // 前端圖片壓縮（縮放至最大 900px、JPEG 品質 0.72，節省雲端空間且載入快速）
        function compressImage(file, maxSize = 900, quality = 0.72) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = reject;
                reader.onload = (e) => {
                    const img = new Image();
                    img.onerror = reject;
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxSize || height > maxSize) {
                            if (width > height) {
                                height = Math.round((height * maxSize) / width);
                                width = maxSize;
                            } else {
                                width = Math.round((width * maxSize) / height);
                                height = maxSize;
                            }
                        }
                        const canvas = document.createElement("canvas");
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL("image/jpeg", quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function normalizeUrl(url) {
            const trimmed = url.trim();
            if (!trimmed) return "";
            return /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
        }

        // Firebase 即時同步 Hook
        function useCloudState(key, defaultValue) {
            const [value, setValue] = useState(() => {
                const fallback = typeof defaultValue === 'function' ? defaultValue() : defaultValue;
                return readLocal(key, fallback);
            });
            const timerRef = useRef(null);
            const isWritingRef = useRef(false);

            useEffect(() => {
                if (!firebaseReady || !db) return;
                const ref = db.ref(`${DB_ROOT}/${key}`);

                const onValue = (snapshot) => {
                    if (isWritingRef.current) return;
                    const remote = snapshot.val();
                    if (remote !== null && remote !== undefined) {
                        setValue(remote);
                        writeLocal(key, remote);
                    } else {
                        const initial = readLocal(key, typeof defaultValue === 'function' ? defaultValue() : defaultValue);
                        ref.set(cleanForFirebase(initial)).catch(console.error);
                    }
                };

                ref.on('value', onValue, (err) => console.error("讀取失敗：", err));
                return () => ref.off('value', onValue);
            }, [key]);

            const setCloudValue = (updater) => {
                setValue(prev => {
                    const next = typeof updater === 'function' ? updater(prev) : updater;
                    writeLocal(key, next);

                    if (firebaseReady && db) {
                        isWritingRef.current = true;
                        if (timerRef.current) clearTimeout(timerRef.current);
                        timerRef.current = setTimeout(() => {
                            db.ref(`${DB_ROOT}/${key}`)
                                .set(cleanForFirebase(next))
                                .catch(console.error)
                                .finally(() => {
                                    setTimeout(() => { isWritingRef.current = false; }, 150);
                                });
                        }, 300);
                    }
                    return next;
                });
            };

            return [value, setCloudValue];
        }

        function moveInArray(arr, index, direction) {
            const target = index + direction;
            if (target < 0 || target >= arr.length) return arr;
            const next = [...arr];
            [next[index], next[target]] = [next[target], next[index]];
            return next;
        }

        // ===== 雲端連線狀態標籤 =====
        const SyncBadge = () => {
            const [connected, setConnected] = useState(false);

            useEffect(() => {
                if (!firebaseReady || !db) return;
                const connRef = db.ref(".info/connected");
                const onConn = (snap) => setConnected(snap.val() === true);
                connRef.on("value", onConn);
                return () => connRef.off("value", onConn);
            }, []);

            if (!firebaseReady) {
                return <span className="text-xs font-bold px-3 py-1 rounded-full bg-amber-100 text-amber-700">🟡 單機模式</span>;
            }
            return (
                <span className={`text-xs font-bold px-3 py-1 rounded-full ${connected ? "bg-emerald-100 text-emerald-700" : "bg-gray-200 text-gray-500"}`}>
                    {connected ? "🟢 雲端即時同步中" : "⚪ 連線中…"}
                </span>
            );
        };

        // ===== 會自動長高的文字框 =====
        const AutoTextarea = ({ value, className, style, ...props }) => {
            const ref = useRef(null);
            const resize = () => {
                const el = ref.current;
                if (!el) return;
                el.style.height = 'auto';
                el.style.height = el.scrollHeight + 'px';
            };
            useEffect(resize, [value]);
            useEffect(() => {
                window.addEventListener('resize', resize);
                return () => window.removeEventListener('resize', resize);
            }, []);
            return <textarea ref={ref} value={value} className={className} style={style} {...props} />;
        };

        // ===== 上下箭頭按鈕組 =====
        const MoveButtons = ({ onUp, onDown, disableUp, disableDown, label }) => (

                <button onClick={onDown} disabled={disableDown} aria-label={`${label}下移`} title="下移" className="p-1 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-white/70 disabled:opacity-20 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-colors">
                    <ChevronDown size={16} />

        // ===== 圖片放大檢視視窗 (Lightbox) =====
        const ImageModal = ({ image, onClose }) => {
            if (!image) return null;
            return (

                    </div>
                </div>
            );
        };

        // ===== 單一清單項目（含子清單、食譜／備註、圖片上傳、補充文件連結）=====
        const ChecklistItemCard = ({ item, index, total, theme, locked, onUpdate, onToggle, onDelete, onMove, onPreviewImage }) => {
            const [expanded, setExpanded] = useState(false);
            const [newSubText, setNewSubText] = useState("");
            const [newLinkLabel, setNewLinkLabel] = useState("");
            const [newLinkUrl, setNewLinkUrl] = useState("");
            const [uploading, setUploading] = useState(false);
            const fileInputRef = useRef(null);

            const subItems = Array.isArray(item.subItems) ? item.subItems : [];
            const images = Array.isArray(item.images) ? item.images : [];
            const links = Array.isArray(item.links) ? item.links : [];
            const note = item.note || "";

            const subDone = subItems.filter(s => s.checked).length;
            const hasDetails = subItems.length > 0 || note.trim().length > 0 || images.length > 0 || links.length > 0;

            // 子清單操作
            const addSubItem = () => {
                if (newSubText.trim() === "") return;
                onUpdate({ subItems: [...subItems, { id: Date.now(), text: newSubText.trim(), checked: false }] });
                setNewSubText("");
            };
            const toggleSubItem = (subId) => onUpdate({ subItems: subItems.map(s => s.id === subId ? { ...s, checked: !s.checked } : s) });
            const updateSubText = (subId, text) => onUpdate({ subItems: subItems.map(s => s.id === subId ? { ...s, text } : s) });
            const deleteSubItem = (subId) => onUpdate({ subItems: subItems.filter(s => s.id !== subId) });

            // 圖片上傳操作
            const handleImageUpload = async (e) => {
                const files = Array.from(e.target.files || []);
                if (files.length === 0) return;
                setUploading(true);
                try {
                    const uploaded = [];
                    for (const file of files) {
                        const dataUrl = await compressImage(file);
                        uploaded.push({ id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, dataUrl, name: file.name });
                    }
                    onUpdate({ images: [...images, ...uploaded] });
                } catch (err) {
                    alert("圖片處理失敗，請換一張圖片再試一次。");
                    console.error(err);
                } finally {
                    setUploading(false);
                    if (fileInputRef.current) fileInputRef.current.value = "";
                }
            };
            const deleteImage = (imgId) => {
                if (confirm("確定要移除這張圖片嗎？")) {
                    onUpdate({ images: images.filter(img => img.id !== imgId) });
                }
            };

            // 補充文件／連結操作
            const addLink = () => {
                const url = normalizeUrl(newLinkUrl);
                if (!url) return;
                const label = newLinkLabel.trim() || url.replace(/^https?:\/\//i, "").slice(0, 32);
                onUpdate({ links: [...links, { id: Date.now(), label, url }] });
                setNewLinkLabel("");
                setNewLinkUrl("");
            };
            const deleteLink = (linkId) => onUpdate({ links: links.filter(l => l.id !== linkId) });

            // 摘要文字組裝
            const summaryParts = [];
            if (subItems.length > 0) summaryParts.push(`🛒 ${subDone}/${subItems.length}`);
            if (note.trim()) summaryParts.push("📝 備註");
            if (images.length > 0) summaryParts.push(`🖼️ ${images.length}`);
            if (links.length > 0) summaryParts.push(`📎 ${links.length}`);

            return (
                <div className={`group rounded-2xl transition-all duration-300 ${item.checked ? 'bg-white/40 opacity-75' : 'bg-white hover:bg-white/95 shadow-sm'}`}>
                    {/* 主項目列 */}
                    <div className="flex items-start gap-2 p-3">
                        <button
                            onClick={onToggle}
                            aria-label="勾選主項目"
                            className={`mt-1 flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors ${item.checked ? `${theme.btnColor} text-white border-transparent` : 'border-pink-300 hover:border-pink-400'}`}
                        >
                            {item.checked && <Check size={14} />}
                        </button>

                        <div className="flex-grow min-w-0">
                            <AutoTextarea
                                disabled={locked}
                                value={item.text}
                                onChange={(e) => onUpdate({ text: e.target.value })}
                                rows={1}
                                className={`w-full bg-transparent rounded-lg px-1 outline-none font-medium text-gray-700 transition-all editable-textarea focus:bg-pink-50/50 disabled:text-gray-700 ${item.checked ? 'line-through text-gray-400' : ''}`}
                                style={{ minHeight: '1.75rem' }}
                            />

                            {/* 展開細項按鈕 */}
                            <div className="flex flex-wrap items-center gap-2 mt-1 px-1">
                                <button
                                    onClick={() => setExpanded(!expanded)}
                                    className={`text-xs font-bold px-2.5 py-0.5 rounded-full transition-colors flex items-center gap-1 ${expanded ? "bg-pink-100 text-pink-600" : (hasDetails ? theme.badgeBg : "bg-gray-100 text-gray-400 hover:bg-gray-200")}`}
                                >
                                    {expanded ? "▲ 收合細項" : (hasDetails ? `▼ ${summaryParts.join(" · ")}` : "＋ 清單 / 圖片 / 文件")}
                                </button>
                            </div>
                        </div>

                        {!locked && (
                            <div className="flex items-start flex-shrink-0 md:opacity-0 md:group-hover:opacity-100 md:focus-within:opacity-100 transition-opacity">
                                <MoveButtons onUp={() => onMove(index, -1)} onDown={() => onMove(index, 1)} disableUp={index === 0} disableDown={index === total - 1} label="項目" />
                                <button onClick={onDelete} aria-label="刪除項目" title="刪除" className="text-gray-300 hover:text-red-400 transition-colors p-1.5">
                                    <Trash2 size={18} />
                                </button>
                            </div>
                        )}
                    </div>

                    {/* 展開區：1.採買清單  2.食譜備註  3.圖片  4.補充文件連結 */}
                    {expanded && (
                        <div className="px-4 pb-4 pt-2 border-t border-dashed border-gray-100 space-y-4 bg-gray-50/60 rounded-b-2xl">
                            {/* 1. 子清單（食材 / 採買勾選） */}
                            <div className="space-y-1.5">
                                <div className="text-xs font-bold text-gray-500 flex items-center justify-between">
                                    <span>🛒 採買清單 / 食材明細</span>
                                    {subItems.length > 0 && <span className="text-gray-400">{subDone}/{subItems.length} 已買</span>}
                                </div>

                                {subItems.map(sub => (
                                    <div key={sub.id} className="flex items-center gap-2 bg-white px-2.5 py-1.5 rounded-xl border border-gray-100">
                                        <button
                                            onClick={() => toggleSubItem(sub.id)}
                                            aria-label="勾選已買"
                                            className={`flex-shrink-0 w-5 h-5 rounded-md border-2 flex items-center justify-center transition-colors ${sub.checked ? "bg-emerald-400 border-transparent text-white" : "border-gray-300 hover:border-emerald-400"}`}
                                        >
                                            {sub.checked && <Check size={12} />}
                                        </button>
                                        <input
                                            type="text"
                                            disabled={locked}
                                            value={sub.text}
                                            onChange={(e) => updateSubText(sub.id, e.target.value)}
                                            className={`flex-grow min-w-0 text-sm bg-transparent outline-none ${sub.checked ? "line-through text-gray-400" : "text-gray-700"}`}
                                        />
                                        {!locked && (
                                            <button onClick={() => deleteSubItem(sub.id)} title="刪除此子項目" className="text-gray-300 hover:text-red-400 p-0.5">
                                                <Trash2 size={14} />
                                            </button>
                                        )}
                                    </div>
                                ))}

                                {!locked && (
                                    <div className="flex gap-1.5 pt-1">
                                        <input
                                            type="text"
                                            value={newSubText}
                                            onChange={(e) => setNewSubText(e.target.value)}
                                            onKeyDown={(e) => { if (e.key === 'Enter') addSubItem(); }}
                                            placeholder="新增食材或採買項目（按 Enter 新增）…"
                                            className="flex-grow min-w-0 text-sm px-3 py-1.5 rounded-xl bg-white border border-dashed border-gray-300 focus:border-pink-400 outline-none text-gray-600 placeholder-gray-400"
                                        />
                                        <button onClick={addSubItem} className="px-3 py-1.5 rounded-xl bg-pink-400 hover:bg-pink-500 text-white text-xs font-bold flex-shrink-0">
                                            新增
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* 2. 食譜 / 備註 */}
                            <div className="space-y-1">
                                <div className="text-xs font-bold text-gray-500">📝 食譜步驟 / 購買地點與備註</div>
                                <AutoTextarea
                                    disabled={locked}
                                    value={note}
                                    onChange={(e) => onUpdate({ note: e.target.value })}
                                    rows={2}
                                    placeholder={locked ? "（無備註）" : "在這裡記錄簡易食譜、推薦超市（如 Woolworths / Coles）或注意事項…"}
                                    className="w-full text-sm px-3 py-2 rounded-xl bg-white border border-gray-200 focus:border-pink-300 outline-none text-gray-600 editable-textarea placeholder-gray-300 disabled:bg-white/70"
                                />
                            </div>

                            {/* 3. 圖片區（商品照、路線圖、食譜照） */}
                            <div className="space-y-2">
                                <div className="flex items-center justify-between">
                                    <span className="text-xs font-bold text-gray-500">🖼️ 參考圖片（點擊可放大）</span>
                                    {!locked && (
                                        <>
                                            <input ref={fileInputRef} type="file" accept="image/*" multiple onChange={handleImageUpload} className="hidden" />
                                            <button
                                                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                                disabled={uploading}
                                                className="text-xs font-bold px-2.5 py-1 rounded-xl bg-white border border-pink-200 text-pink-500 hover:bg-pink-50 transition-colors disabled:opacity-50"
                                            >
                                                {uploading ? "壓縮上傳中…" : "＋ 上傳圖片"}
                                            </button>
                                        </>
                                    )}
                                </div>
                                {images.length > 0 && (
                                    <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                                        {images.map(img => (
                                            <div key={img.id} className="relative group/img aspect-square rounded-xl overflow-hidden bg-white border border-gray-200 shadow-sm">
                                                <img
                                                    src={img.dataUrl}
                                                    alt={img.name || "參考圖片"}
                                                    onClick={() => onPreviewImage(img)}
                                                    className="w-full h-full object-cover cursor-zoom-in hover:scale-105 transition-transform"
                                                />
                                                {!locked && (
                                                    <button
                                                        onClick={() => deleteImage(img.id)}
                                                        title="刪除圖片"
                                                        className="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/60 text-white text-xs font-bold flex items-center justify-center hover:bg-red-500 transition-colors"
                                                    >
                                                        ×
                                                    </button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* 4. 補充文件與網頁連結 */}
                            <div className="space-y-1.5">
                                <div className="text-xs font-bold text-gray-500">📎 補充文件 / 雲端檔案連結</div>
                                {links.map(link => (
                                    <div key={link.id} className="flex items-center justify-between gap-2 bg-white px-3 py-1.5 rounded-xl border border-gray-100 text-sm">
                                        <a href={link.url} target="_blank" rel="noopener noreferrer" className="text-blue-500 hover:text-blue-600 underline truncate font-medium">
                                            🔗 {link.label}
                                        </a>
                                        {!locked && (
